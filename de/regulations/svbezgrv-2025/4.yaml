format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: de/regulation/svbezgrv-2025/4
    source_sha256: 711017bbdb17a7837a5f97ebcde33af76261ae59e28b57670abfbf968e0b0152
  summary: § 4 Abs. 1 setzt für 2025 die Beitragsbemessungsgrenzen der allgemeinen
    Rentenversicherung auf 96 600 Euro jährlich beziehungsweise 8 050 Euro monatlich
    und der knappschaftlichen Rentenversicherung auf 118 800 Euro jährlich beziehungsweise
    9 900 Euro monatlich fest. § 4 Abs. 2 ergänzt Anlage 2 zum Sechsten Buch Sozialgesetzbuch
    um den Zeitraum „1.1.2025 – 31.12.2025“ und die jeweiligen Jahresbeträge.
