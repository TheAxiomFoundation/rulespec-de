    required: true
  source_verification:
    corpus_citation_path: de/regulation/svbezgrv-2025/2
    source_sha256: becd570c345b18381e5edd54a33754085b0ba1f80e879de6af961c07a9192bf4
  summary: Die Jahresarbeitsentgeltgrenze nach § 6 Absatz 6 SGB V wird für 2025 auf
    73 800 Euro und monatlich auf 6 150 Euro festgesetzt. Die Grenze nach § 6 Absatz
    7 SGB V wird auf 66 150 Euro und monatlich auf 5 512,50 Euro festgesetzt.
