  summary: Der monatliche Mindestunterhalt beträgt in der ersten Altersstufe 482 Euro
    ab dem 1. Januar 2025 und 486 Euro ab dem 1. Januar 2026, in der zweiten Altersstufe
    554 Euro und 558 Euro sowie in der dritten Altersstufe 649 Euro und 653 Euro.
