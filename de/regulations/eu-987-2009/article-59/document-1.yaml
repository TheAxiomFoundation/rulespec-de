rules:
- name: documented_change_in_query_month
  kind: derived
  entity: Family
  dtype: Judgment
  period: Month
  source: Artikel 59 Absatz 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: de/regulation/eu-987-2009/article-59/document-1
          excerpt: 'Ändern sich zwischen den Mitgliedstaaten während eines Kalen­

            dermonats die Rechtsvorschriften und/oder die Zuständigkeit für die

            Gewährung von Familienleistungen'
  versions:
  - effective_from: '2025-01-01'
    formula: 'coordination_decision_exists

      and beginning_of_month_payment_record_exists

      and coordination_decision_case_id == payment_record_case_id

      and coordination_decision_child_id == payment_record_child_id

      and decision_originating_member_state_id == payment_record_originating_member_state_id

      and decision_receiving_member_state_id == affected_institution_member_state_id

      and current_institution_id == beginning_of_month_payer_institution_id

      and affected_institution_id != current_institution_id

      and recorded_effective_transition_date >= period_start

      and recorded_effective_transition_date <= period_end'
- name: initial_payer_must_continue_family_benefit_payments
  kind: derived
  entity: Family
  dtype: Judgment
  period: Month
  source: Artikel 59 Absatz 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: de/regulation/eu-987-2009/article-59/document-1
          excerpt: 'so setzt der Träger, der die Fami­

            lienleistungen nach den Rechtsvorschriften gezahlt hat, nach denen die

            Leistungen zu Beginn dieses Monats gewährt wurden, unabhängig von

            den in den Rechtsvorschriften dieser Mitgliedstaaten für die Gewährung

            von Familienleistungen vorgesehenen Zahlungsfristen die Zahlungen bis

            zum Ende des laufenden Monats fort.'
  versions:
  - effective_from: '2025-01-01'
    formula: documented_change_in_query_month
- name: initial_payer_cessation_date
  kind: derived
  entity: Family
  dtype: Date
  period: Month
  source: Artikel 59 Absatz 1 und 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: de/regulation/eu-987-2009/article-59/document-1
          excerpt: die Zahlungen bis zum Ende des laufenden Monats fort.
  versions:
  - effective_from: '2025-01-01'
    formula: period_end
- name: successor_handover_date
  kind: derived
  entity: Family
  dtype: Date
  period: Month
  source: Artikel 59 Absatz 2
