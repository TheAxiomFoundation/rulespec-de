  versions:
  - effective_from: '2025-01-01'
    formula: 'coordination_decision_exists

      and beginning_of_month_payment_record_exists

      and coordination_decision_case_id == payment_record_case_id

      and coordination_decision_child_id == payment_record_child_id

      and decision_receiving_member_state_id == affected_institution_member_state_id

      and current_institution_id == affected_institution_id

