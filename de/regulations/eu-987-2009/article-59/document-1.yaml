rules:
- name: documented_transition_records_match
  kind: derived
  entity: Family
  dtype: Judgment
  period: Month
  source: Artikel 59 Abs. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: de/regulation/eu-987-2009/article-59/document-1
          excerpt: 'Ändern sich zwischen den Mitgliedstaaten während eines Kalen­

            dermonats die Rechtsvorschriften und/oder die Zuständigkeit'
  versions:
  - effective_from: '2025-01-01'
    formula: 'coordination_decision_record_exists

      and beginning_of_change_month_payment_record_exists

      and current_case_id == decision_case_id

      and current_case_id == payment_record_case_id

      and current_child_id == decision_child_id

      and current_child_id == payment_record_child_id

      and decision_originating_member_state_id == original_payer_at_start_of_change_month_member_state_id

      and decision_receiving_member_state_id == affected_institution_member_state_id

      and decision_originating_member_state_id != decision_receiving_member_state_id'
- name: transition_is_in_query_month
  kind: derived
  entity: Family
  dtype: Judgment
  period: Month
  source: Artikel 59 Abs. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: predicate
        source:
          corpus_citation_path: de/regulation/eu-987-2009/article-59/document-1
          excerpt: 'während eines Kalen­

            dermonats'
  versions:
  - effective_from: '2025-01-01'
    formula: 'recorded_effective_transition_date >= period_start

      and recorded_effective_transition_date <= period_end'
- name: transition_is_in_previous_month
  kind: derived
  entity: Family
  dtype: Judgment
  period: Month
  source: Artikel 59 Abs. 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: ordering
        source:
          corpus_citation_path: de/regulation/eu-987-2009/article-59/document-1
          excerpt: 'Ab diesem Zeit­

            punkt übernehmen der andere betroffene Mitgliedstaat oder die anderen

            betroffenen Mitgliedstaaten die Zahlung der Leistungen.'
  versions:
  - effective_from: '2025-01-01'
    formula: 'recorded_effective_transition_date >= date_add_months(period_start,
      -1)

      and recorded_effective_transition_date <= date_add_days(period_start, -1)'
