- name: affected_successor_must_pay_family_benefits
  kind: derived
  entity: Institution
  dtype: Judgment
  period: Month
  source: Artikel 59 Absatz 2
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: de/regulation/eu-987-2009/article-59/document-1
          excerpt: 'Ab diesem Zeit­

            punkt übernehmen der andere betroffene Mitgliedstaat oder die anderen

            betroffenen Mitgliedstaaten die Zahlung der Leistungen.'
  versions:
  - effective_from: '0001-01-01'
    formula: 'documented_coordination_records_match

      and successor_payment_period_applies

      and current_institution_identifier == affected_successor_institution_identifier'
