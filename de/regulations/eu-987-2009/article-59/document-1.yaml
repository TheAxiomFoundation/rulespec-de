          excerpt: Er unterrichtet den Träger des anderen betroffenen Mitgliedstaats
            oder die anderen betroffenen Mitgliedstaaten von dem Zeitpunkt, zu dem
            er die Zahlung dieser Familienleistungen einstellt.
  versions:
  - effective_from: '2025-01-01'
    formula: documented_change_in_query_month
- name: documented_preceding_month_change_for_successor
