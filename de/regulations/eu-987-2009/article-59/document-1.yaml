format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: de/regulation/eu-987-2009/article-59/document-1
    source_sha256: 206dec7f84e0da10111fcb51531e167f263bd385a792ef148a7768fa411abbb5
  summary: „Ändern sich zwischen den Mitgliedstaaten während eines Kalendermonats
    die Rechtsvorschriften und/oder die Zuständigkeit für die Gewährung von Familienleistungen,
    so setzt der Träger ... die Zahlungen bis zum Ende des laufenden Monats fort.“
    „Ab diesem Zeitpunkt übernehmen der andere betroffene Mitgliedstaat oder die anderen
    betroffenen Mitgliedstaaten die Zahlung der Leistungen.“
