rules:
- name: issuer_signature_mechanism_documentarily_conforms
  kind: derived
  entity: Document
  dtype: Judgment
  period: Day
  source: BGB § 126 Abs. 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: de/statute/bgb/126/absatz-1/inhalt
          excerpt: (1) Ist durch Gesetz schriftliche Form vorgeschrieben, so muss
            die Urkunde von dem Aussteller eigenhändig durch Namensunterschrift oder
            mittels notariell beglaubigten Handzeichens unterzeichnet werden.
  versions:
  - effective_from: '2025-01-01'
    formula: "signature_is_present\nand document_identifier > 0\nand document_version_identifier\
      \ > 0\nand issuer_identifier > 0\nand signature_issuer_identifier > 0\nand signature_document_identifier\
      \ > 0\nand signature_document_version_identifier > 0\nand signature_issuer_identifier\
      \ == issuer_identifier\nand signature_document_identifier == document_identifier\n\
      and signature_document_version_identifier == document_version_identifier\nand\
      \ (\n  signature_observed_physical_method == \"handwritten_name_signature\"\n\
      \  or (\n    signature_observed_physical_method == \"handmark\"\n    and signature_handmark_identifier\
      \ > 0\n    and issued_notarial_authentication_is_present\n    and notarial_authentication_issuer_identifier\
      \ > 0\n    and notarial_authentication_document_identifier > 0\n    and notarial_authentication_document_version_identifier\
      \ > 0\n    and notarial_authentication_handmark_identifier > 0\n    and notarial_authentication_issuer_identifier\
      \ == issuer_identifier\n    and notarial_authentication_document_identifier\
      \ == document_identifier\n    and notarial_authentication_document_version_identifier\
      \ == document_version_identifier\n    and notarial_authentication_handmark_identifier\
      \ == signature_handmark_identifier\n  )\n)"
