rules:
- name: issuer_signature_route_conforms_for_statutory_written_form
  kind: derived
  entity: Document
  dtype: Judgment
  period: Year
  source: BGB § 126 Abs. 1 Satz 1
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: de/statute/bgb/126/absatz-1/inhalt
          excerpt: so muss die Urkunde von dem Aussteller eigenhändig durch Namensunterschrift
            oder mittels notariell beglaubigten Handzeichens unterzeichnet werden.
  versions:
  - effective_from: '2025-01-01'
    formula: "document_has_signature_record\nand signature_document_version_identifier\
      \ == document_version_identifier\nand signature_signer_identifier == document_issuer_identifier\n\
      and (\n  actual_signature_method == \"eigenhaendige_namensunterschrift\"\n \
      \ or (\n    actual_signature_method == \"handzeichen\"\n    and notarial_authentication_record_is_issued\n\
      \    and notarial_authentication_document_version_identifier == document_version_identifier\n\
      \    and notarial_authentication_issuer_identifier == document_issuer_identifier\n\
      \    and notarial_authentication_handmark_identifier == signature_handmark_identifier\n\
      \  )\n)"
