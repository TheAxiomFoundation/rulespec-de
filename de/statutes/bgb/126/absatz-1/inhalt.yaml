  summary: Ist durch Gesetz schriftliche Form vorgeschrieben, so muss die Urkunde
    von dem Aussteller eigenhändig durch Namensunterschrift oder mittels notariell
    beglaubigten Handzeichens unterzeichnet werden. The supported-2025 window is a
    consumer evaluation boundary, not a statutory commencement claim.
