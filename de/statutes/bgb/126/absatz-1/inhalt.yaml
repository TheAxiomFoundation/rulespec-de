rules:
- name: issuer_signature_mechanism_documentarily_conforms
  kind: derived
  entity: Document
  dtype: Judgment
  period: Day
  description: Documentary-evidence conformance with the issuer-signature mechanism
    of BGB § 126 Absatz 1, applicable where statutory written form is required; this
    is not a determination of global contract validity or of every legally available
    writing substitute.
  source: BGB § 126 Abs. 1
  metadata:
