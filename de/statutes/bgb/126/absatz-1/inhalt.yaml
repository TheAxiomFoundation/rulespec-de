      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: de/statute/bgb/126/absatz-1/inhalt
          excerpt: (1) Ist durch Gesetz schriftliche Form vorgeschrieben, so muss
            die Urkunde von dem Aussteller eigenhändig durch Namensunterschrift oder
            mittels notariell beglaubigten Handzeichens unterzeichnet werden.
  versions:
  - effective_from: '2025-01-01'
    formula: "statutory_written_form_is_required\nand signature_record_present\nand\
      \ document_issuer_identifier != \"\"\nand document_version_identifier != \"\"\
      \nand signature_signer_identifier != \"\"\nand signature_signer_identifier ==\
      \ document_issuer_identifier\nand signature_document_version_identifier != \"\
      \"\nand signature_document_version_identifier == document_version_identifier\n\
      and (\n  signature_is_handwritten_name_signature\n  or (\n    signature_is_handmark\n\
      \    and notarial_authentication_present\n    and signature_handmark_identifier\
      \ != \"\"\n    and notarial_authentication_handmark_identifier != \"\"\n   \
      \ and signature_handmark_identifier == notarial_authentication_handmark_identifier\n\
      \    and notarial_authentication_issuer_identifier != \"\"\n    and notarial_authentication_issuer_identifier\
      \ == document_issuer_identifier\n    and notarial_authentication_document_version_identifier\
      \ != \"\"\n    and notarial_authentication_document_version_identifier == document_version_identifier\n\
      \  )\n)"
