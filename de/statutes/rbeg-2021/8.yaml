format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: de/statute/rbeg-2021/8
    source_sha256: 0783343f3ce3c3b691ea8bee3047e3a818af42b0da4902c6ff3b28c372e4a964
  summary: 'Zum 1. Januar 2021 betragen die Regelbedarfsstufen 1 bis 6 jeweils

    446 Euro, 401 Euro, 357 Euro, 373 Euro, 309 Euro und 283 Euro.

    Die Stufen 4 bis 6 unterscheiden Jugendliche und Kinder nach den

    ausdrücklich genannten Lebensjahresgrenzen.'
