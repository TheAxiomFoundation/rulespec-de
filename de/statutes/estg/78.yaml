- name: section_64_application_receipt_cutoff_reached
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 78 Abs. 5 Satz 2 EStG
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: de/statute/estg/78
          excerpt: vom Beginn des Monats an anzuwenden
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: de/statute/estg/78
          excerpt: ein hierauf gerichteter Antrag bei der zuständigen Stelle eingegangen
