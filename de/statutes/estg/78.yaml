- name: kindergeld_was_received_for_december_1990
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: § 78 Abs. 5 Satz 1 EStG
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: de/statute/estg/78
          excerpt: die für Dezember 1990 für ihre Kinder Kindergeld
      - path: versions[0].formula
        kind: definition
        source:
          corpus_citation_path: de/statute/estg/78
          excerpt: bezogen haben
  versions:
  - effective_from: '2025-01-01'
    formula: 'has_kindergeld_payment_record_for_child

      and kindergeld_payment_reference_year == december_1990_payment_reference_year

