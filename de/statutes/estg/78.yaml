format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: de/statute/estg/78
    source_sha256: 7105366cec1d12d8fb02bc1a87c7fd268517a0701b159e2134db5e0e7dc999a8
  summary: § 78 Abs. 5 Satz 1 preserves Kindergeld for children for whom Kindergeld
    was received for December 1990 in the territory named in Article 3 of the Unification
    Treaty while residence and child-qualification requirements continue. Satz 2 applies
    § 64 Abs. 2 und 3 from the beginning of the month in which the relevant application
    is received and credits payments made under Satz 1 against the subsequently entitled
    person.
  deferred_outputs:
  - output: de:statutes/estg/78/5#transition_adjusted_recipient_priority
    reason: de/statute/estg/78(5) cannot compute the full transition-adjusted recipient
      selection, including the ordinary-priority fallback, because the source explicitly
      applies § 64 Absatz 2 und 3 and the executable upstream output de:statutes/estg/64#recipient_priority
      is missing. This leaves continuing residence, continuing child qualification,
      Article 3 treaty territory, office competence, preserved priority and successor
      selection unimplemented; the receipt cutoff alone does not establish them.
    blocked_by:
    - de:statutes/estg/64#recipient_priority
  - output: de:statutes/estg/78/5/satz-2#sentence_1_payments_credited_to_successor_for_same_child
    reason: de/statute/estg/78(5)(satz-2) cannot compute the credit of payments made
      under Satz 1 to the person entitled under § 64 Absatz 2 und 3 because the executable
      upstream output de:statutes/estg/64#recipient_priority is missing. The source
      also requires identification of the successor, the same child, and payments
      lawfully made under Satz 1; the successor need not personally have received
      the credited payment.
    blocked_by:
    - de:statutes/estg/64#recipient_priority
inputs:
- name: has_kindergeld_payment_record_for_child
  entity: Person
  dtype: Boolean
  period: Month
- name: kindergeld_payment_reference_year
  entity: Person
  dtype: Integer
  period: Month
- name: kindergeld_payment_reference_month
  entity: Person
  dtype: String
  period: Month
- name: relevant_section_64_application_was_received
  entity: Person
  dtype: Boolean
  period: Month
- name: relevant_section_64_application_receipt_date
  entity: Person
  dtype: Date
  period: Month
rules:
