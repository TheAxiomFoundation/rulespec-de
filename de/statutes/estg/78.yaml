  dtype: Integer
  source: § 78 Abs. 5 Satz 1 EStG
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: de/statute/estg/78
          excerpt: für Dezember 1990 für ihre Kinder Kindergeld
  versions:
  - effective_from: '2025-01-01'
    formula: '1990'
- name: december_payment_reference_month
  kind: parameter
  dtype: String
  source: § 78 Abs. 5 Satz 1 EStG
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: de/statute/estg/78
          excerpt: für Dezember 1990 für ihre Kinder Kindergeld
  versions:
  - effective_from: '2025-01-01'
