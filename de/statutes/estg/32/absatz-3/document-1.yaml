format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: de/statute/estg/32/absatz-3/document-1
    source_sha256: 024328471bff999d0b5c974ba6c5092a96ec6bb38b420d3cbd110fcc1db11a1c
  summary: Ein Kind wird in dem Kalendermonat, in dem es lebend geboren wurde, und
    in jedem folgenden Kalendermonat, zu dessen Beginn es das 18. Lebensjahr noch
    nicht vollendet hat, berücksichtigt.
inputs:
- name: live_birth_register_entry_exists
  entity: Person
  dtype: Boolean
  period: Month
- name: recorded_live_birth_date
  entity: Person
  dtype: String
  period: Month
rules:
- name: age_limit_years
  kind: parameter
  dtype: Integer
  source: EStG § 32 Abs. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: parameter
        source:
          corpus_citation_path: de/statute/estg/32/absatz-3/document-1
          excerpt: das 18. Lebensjahr noch nicht vollendet hat
  versions:
  - effective_from: '2025-01-01'
    formula: '18'
- name: eighteenth_birthday_attainment_date
  kind: derived
  entity: Person
  dtype: String
  period: Month
  source: EStG § 32 Abs. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: de/statute/estg/32/absatz-3/document-1
          excerpt: zu dessen Beginn es das 18. Lebensjahr noch nicht vollendet hat
  versions:
  - effective_from: '2025-01-01'
    formula: 'if date_add_years(date_add_years(recorded_live_birth_date, age_limit_years),
      -age_limit_years) != recorded_live_birth_date: date_add_days(date_add_years(recorded_live_birth_date,
      age_limit_years), 1) else: date_add_years(recorded_live_birth_date, age_limit_years)'
- name: child_considered_in_calendar_month
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: EStG § 32 Abs. 3
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: de/statute/estg/32/absatz-3/document-1
          excerpt: 'Ein Kind wird in dem Kalendermonat, in dem es lebend geboren wurde,
            und in jedem folgenden

            Kalendermonat, zu dessen Beginn es das 18. Lebensjahr noch nicht vollendet
            hat, berücksichtigt.'
  versions:
  - effective_from: '2025-01-01'
    formula: "live_birth_register_entry_exists\nand (\n  (\n    recorded_live_birth_date\
      \ >= period_start\n    and recorded_live_birth_date <= period_end\n  )\n  or\
      \ (\n    recorded_live_birth_date < period_start\n    and period_start < eighteenth_birthday_attainment_date\n\
      \  )\n)"
