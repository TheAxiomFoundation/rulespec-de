      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: de/statute/bgb/187
          excerpt: (2) Ist der Beginn eines Tages der für den Anfang einer Frist maßgebende
            Zeitpunkt, so wird dieser Tag bei der Berechnung der Frist mitgerechnet.
            Das Gleiche gilt von dem Tage der Geburt bei der Berechnung des Lebensalters.
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: de/statute/bgb/188
          excerpt: '(2) Eine Frist, die nach Wochen, nach Monaten oder nach einem
            mehrere Monate umfassenden Zeitraum - Jahr, halbes Jahr, Vierteljahr -
            bestimmt ist, endigt im Falle des § 187 Abs. 1 mit dem Ablauf desjenigen
            Tages der letzten Woche oder des letzten Monats, welcher durch seine Benennung
            oder seine Zahl dem Tage entspricht, in den das Ereignis oder der Zeitpunkt
            fällt, im Falle des § 187 Abs. 2 mit dem Ablauf desjenigen Tages der letzten
            Woche oder des letzten Monats, welcher dem Tage vorhergeht, der durch
            seine Benennung oder seine Zahl dem Anfangstag der Frist entspricht.

            (3) Fehlt bei einer nach Monaten bestimmten Frist in dem letzten Monat
            der für ihren Ablauf maßgebende Tag, so endigt die Frist mit dem Ablauf
            des letzten Tages dieses Monats.'
  versions:
  - effective_from: '2025-01-01'
    formula: 'if date_add_years(date_add_years(recorded_live_birth_date, child_age_limit_years),
      -child_age_limit_years) != recorded_live_birth_date: date_add_days(date_add_years(recorded_live_birth_date,
      child_age_limit_years), 1) else: date_add_years(recorded_live_birth_date, child_age_limit_years)'
- name: child_considered
  kind: derived
