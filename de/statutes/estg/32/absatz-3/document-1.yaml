    formula: "live_birth_register_entry_exists\nand (\n  (recorded_live_birth_date\
      \ >= period_start and recorded_live_birth_date <= period_end)\n  or (\n    recorded_live_birth_date\
      \ < period_start\n    and period_start < eighteenth_birthday_attainment_date\n\
      \  )\n)"
